name: Android Release

# This workflow creates a release on every push to main.
# The versionCode is automatically set to the GitHub run number to ensure
# consistency between the APK manifest and the release tag/filename.
# Only versionName needs to be updated manually in app/build.gradle.kts.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Update versionCode to match build number
      run: |
        # Update versionCode in build.gradle.kts to match GitHub run number
        # This ensures the APK manifest matches the filename and tag
        sed -i "s/versionCode = [0-9]\+/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
        echo "Updated versionCode to ${{ github.run_number }}"
        grep "versionCode" app/build.gradle.kts
      
    - name: Decode Keystore (if provided)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          echo "Keystore configured for production signing"
        else
          echo "No keystore configured, will use debug signing"
        fi
      
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Get version name
      id: version
      run: |
        VERSION_NAME=$(grep "versionName" app/build.gradle.kts | awk -F'"' '{print $2}')
        VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | awk -F'=' '{print $2}' | tr -d ' ')
        echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
        echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
        echo "Version: ${VERSION_NAME} (${VERSION_CODE})"
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
        
    - name: Rename APK
      run: |
        # Determine if this is a production signed build or debug signed
        if [ -f "release.keystore" ]; then
          SUFFIX="release"
        else
          SUFFIX="debug-signed"
        fi
        
        # Find the APK file (could be app-release.apk or app-release-unsigned.apk)
        APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
        mv "$APK_FILE" \
           app/build/outputs/apk/release/NewsAgent-v${{ steps.version.outputs.version_name }}-build${{ github.run_number }}-${SUFFIX}.apk
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version_name }}-build${{ github.run_number }}
        name: Release v${{ steps.version.outputs.version_name }} (Build ${{ github.run_number }})
        draft: false
        prerelease: false
        body: |
          ## NewsAgent v${{ steps.version.outputs.version_name }}
          
          Auto-generated release from commit ${{ github.sha }}
          
          ### Installation
          Download the APK below and install it on your Android device.
          
          ${{ env.KEYSTORE_FILE && '**Note**: This APK is signed with a production keystore for secure distribution.' || '**Note**: This APK is signed with a debug key for testing. For production use, configure proper signing keys in repository secrets.' }}
          
          ### Changes
          See commit history for details.
          
          ### Download
          - Release APK: See assets below
        files: |
          app/build/outputs/apk/release/NewsAgent-v${{ steps.version.outputs.version_name }}-*.apk
